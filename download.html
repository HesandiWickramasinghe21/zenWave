<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Soon | ZenWave</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --p: #7F7CFF;
            --p-gradient: linear-gradient(135deg, #8a84ff 0%, #add8ff 100%);
            --section-gradient: linear-gradient(135deg, #f8faff 0%, #ffffff 50%, #f0f4ff 100%);
            --text-main: #2D3436;
            --m: #636E72;
            --border-color: rgba(127, 124, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--section-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Main Launch Card */
        .launch-card {
            background: #ffffff;
            width: 90%;
            max-width: 550px;
            padding: 60px 40px;
            border-radius: 40px;
            text-align: center;
            position: relative;
            box-shadow: 0 30px 60px rgba(127, 124, 255, 0.12);
            border: 1px solid var(--border-color);
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .launch-logo {
            height: 90px;
            width: auto;
        }

        .rocket-icon {
            font-size: 48px;
            display: inline-block;
            margin-bottom: 20px;
            background: var(--p-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rocketFloat 3s ease-in-out infinite;
        }

        @keyframes rocketFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        .badge {
            display: inline-block;
            background: rgba(127, 124, 255, 0.08);
            color: var(--p);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        p {
            font-size: 16px;
            color: var(--m);
            line-height: 1.6;
            margin-bottom: 35px;
            padding: 0 20px;
        }

        /* Notify Me Button */
        .btn-notify {
            background: var(--p-gradient);
            color: white;
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(138, 132, 255, 0.35);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-notify:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(138, 132, 255, 0.45);
        }

        .back-home {
            margin-top: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: var(--p);
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-home:hover {
            opacity: 0.7;
            transform: translateX(-5px);
        }

        /* Success Message Styling */
        .hidden { display: none; }
        .success-text {
            color: #16a34a;
            font-weight: 700;
            margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .launch-card { padding: 40px 20px; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div class="launch-card">
        <div class="logo-container">
            <img src="logo.png" alt="ZenWave" class="launch-logo">
        </div>

        <div class="rocket-icon">
            <i class="fa-solid fa-rocket"></i>
        </div>

        <br>
        <div class="badge">Coming Spring 2026</div>

        <h1>Launching Soon</h1>
        
        <p>Our mobile application is currently in the final stages of private beta. We're polishing the experience to ensure your journey to wellness is perfect.</p>

        <div id="action-area">
            <button class="btn-notify" onclick="handleNotify()">
                Notify Me <i class="fa-solid fa-bell" style="margin-left: 10px;"></i>
            </button>
        </div>
        
        <div id="success-msg" class="hidden">
            <p class="success-text">✨ We'll notify you the moment we launch!</p>
        </div>

        <a href="home.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Back to Homepage
        </a>
    </div>

    <script>
        function handleNotify() {
            // Animates the button disappearing and success message appearing
            document.getElementById('action-area').classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
            
            // You can add logic here to redirect or open a mailto if you prefer
            console.log("Notification request received.");
        }
    </script>

</body>
</html>
